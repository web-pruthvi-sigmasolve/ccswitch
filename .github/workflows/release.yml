name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          # Latest stable Go: Go 1.22 builds darwin binaries without LC_UUID,
          # which current macOS dyld refuses to load (golang/go#68678).
          go-version: "stable"
          check-latest: true
          cache: true
      - name: Test
        run: go test ./... -race -count=1
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional package channels. Keep all four lines even before the
          # secrets exist: a missing secret expands to an empty string, so the
          # variable is always defined (the .goreleaser.yaml templates need it).
          # Empty HOMEBREW_TAP_TOKEN / SCOOP_BUCKET_TOKEN / WINGET_PKGS_TOKEN make
          # their skip_upload template evaluate to "true", so that channel is
          # skipped. An empty AUR_KEY makes the AUR pipe skip itself.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
